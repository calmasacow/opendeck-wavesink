[package]
name = "opendeck-wavesink"
version = "1.0.0"
authors = ["calmasacow"]
description = "WaveSink mixer control for OpenDeck"
repository = "https://github.com/calmasacow/opendeck-wavesink"
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
openaction = "2.6"
anyhow = "1.0"
base64 = "0.22"
log = "0.4"
simplelog = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
